packages:
  - .
  - docs

preferFrozenLockfile: true
strictSsl: true
strictPeerDependencies: true
autoInstallPeers: false
saveExact: true
auditLevel: high
ignoreScripts: true
verifyStoreIntegrity: true
minimumReleaseAge: 10080
# User-approved exact first-party versions for the Dory rollout.
minimumReleaseAgeExclude:
  - '@clidey/dory@1.10.0'
  - '@clidey/ux@1.6.4'
  - vite@8.3.5
